<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password</title>
  <style>
    :root {
      --bg1: #f7f1eb;
      --bg2: #f2e1d8;
      --card: rgba(255,255,255,0.92);
      --text: #251815;
      --muted: #6d5c56;
      --accent: #5a0f1b;
      --accent2: #a43b2d;
      --border: #ead8d1;
      --shadow: 0 20px 60px rgba(58, 18, 20, 0.12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(164,59,45,0.18), transparent 30%),
        radial-gradient(circle at bottom right, rgba(90,15,27,0.14), transparent 28%),
        linear-gradient(135deg, var(--bg1), var(--bg2));
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      width: min(100%, 460px);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 32px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }
    h1 { margin: 0 0 10px; font-size: 30px; }
    p { margin: 0 0 20px; color: var(--muted); line-height: 1.5; }
    label { display: block; margin: 16px 0 8px; font-weight: 700; font-size: 14px; }
    input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 15px;
      font-size: 15px;
      outline: none;
      background: #fff;
    }
    input:focus {
      border-color: var(--accent2);
      box-shadow: 0 0 0 4px rgba(164,59,45,0.12);
    }
    button {
      width: 100%;
      margin-top: 18px;
      border: 0;
      border-radius: 14px;
      padding: 14px 16px;
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      cursor: pointer;
      transition: transform .15s ease, opacity .15s ease;
    }
    button:hover { transform: translateY(-1px); }
    button:disabled { opacity: .7; cursor: not-allowed; }
    .msg {
      margin-top: 14px;
      min-height: 20px;
      font-size: 14px;
      color: var(--muted);
    }
    .hint {
      margin-top: 12px;
      font-size: 13px;
      color: var(--muted);
    }
    .link {
      display: inline-block;
      margin-top: 18px;
      color: var(--accent);
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Reset Password</h1>
    <p>Enter the email, OTP, and your new password.</p>

    <label for="email">Email</label>
    <input id="email" type="email" placeholder="user@gmail.com" autocomplete="email">

    <label for="otp">OTP</label>
    <input id="otp" type="text" placeholder="6-digit code" inputmode="numeric" maxlength="6">

    <label for="password">New Password</label>
    <input id="password" type="password" placeholder="New password" minlength="6">

    <label for="confirm">Confirm Password</label>
    <input id="confirm" type="password" placeholder="Confirm new password" minlength="6">

    <button id="resetBtn" type="button" onclick="resetPassword()">Reset Password</button>
    <div id="msg" class="msg"></div>
    <div class="hint">OTP expires in 10 minutes.</div>

    <a class="link" href="forgot-password.html">Back to Forgot Password</a>
  </div>

  <script>
    const urlToken = new URLSearchParams(window.location.search).get('token');
    if (urlToken) {
      document.getElementById('otp').dataset.token = urlToken;
    }

    async function resetPassword() {
      const email = document.getElementById('email').value.trim();
      const otp = document.getElementById('otp').value.trim();
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;
      const msg = document.getElementById('msg');
      const btn = document.getElementById('resetBtn');
      msg.textContent = '';

      if (password !== confirm) {
        msg.textContent = 'Passwords do not match.';
        return;
      }

      btn.disabled = true;
      try {
        const res = await fetch('/api/verify-otp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, otp, password })
        });
        const data = await res.json();
        msg.textContent = data.message || 'Done';
      } catch (err) {
        msg.textContent = 'Something went wrong. Please try again.';
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
